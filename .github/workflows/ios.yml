name: iOS

# macOS minutes are expensive: the macOS job runs on main, by hand, and on PRs that touch the iOS app.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer PR run cancels the older one; each push to main gets its own group, so main always finishes.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Cheap Linux gate, so this workflow reports on every PR (a skipped job counts as passing for required checks).
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if echo "$FILES" | grep -qE '^(DutifulDailyDevotional[A-Za-z]*|Shared)/|^project\.yml$|^\.github/workflows/ios\.yml$'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "No iOS files changed, so the macOS build was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: No-network guard
        run: |
          if grep -rnE 'URLSession|WKWebView|https?://' --include='*.swift' Shared DutifulDailyDevotional DutifulDailyDevotionalWidget; then
            echo "Networking APIs or web URLs found in Swift sources (spec section 7)." && exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project DutifulDailyDevotional.xcodeproj \
            -scheme DutifulDailyDevotional \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      # Unsigned simulator build for Appetize.io: a zip with the .app at its root.
      - name: Build simulator app for Appetize
        run: |
          xcodebuild build \
            -project DutifulDailyDevotional.xcodeproj \
            -scheme DutifulDailyDevotional \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent DutifulDailyDevotional.app "$GITHUB_WORKSPACE/DutifulDailyDevotional-simulator.zip"
          cd "$GITHUB_WORKSPACE"
          unzip -l DutifulDailyDevotional-simulator.zip | head -8
          unzip -Z1 DutifulDailyDevotional-simulator.zip | grep -qx 'DutifulDailyDevotional.app/DutifulDailyDevotional' \
            || { echo "zip must hold DutifulDailyDevotional.app at its root"; exit 1; }

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          path: DutifulDailyDevotional-simulator.zip
          archive: false
          retention-days: 30
          if-no-files-found: error

      # main only, so the stable Appetize link never shows an unmerged PR. PRs keep the zip artifact above.
      - name: Upload to Appetize
        if: github.ref == 'refs/heads/main'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "No APPETIZE_API_TOKEN secret (e.g. a fork PR); skipping Appetize upload."
            exit 0
          fi
          # Update the same app when its key is known, so the link never changes.
          URL="https://api.appetize.io/v1/apps${APPETIZE_PUBLIC_KEY:+/$APPETIZE_PUBLIC_KEY}"
          RESPONSE=$(curl -sS --fail-with-body -X POST "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@DutifulDailyDevotional-simulator.zip" \
            -F "platform=ios" \
            --form-string "note=${GITHUB_SHA::7}")
          KEY=$(echo "$RESPONSE" | jq -r '.publicKey')
          [ -n "$KEY" ] && [ "$KEY" != null ] || { echo "Unexpected Appetize response: $RESPONSE"; exit 1; }
          LINK="https://appetize.io/app/$KEY"
          {
            echo "### Try the app in your browser"
            echo "$LINK (build ${GITHUB_SHA::7})"
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              echo
              echo "First upload created a new Appetize app. Keep this link stable with:"
              echo '`gh variable set APPETIZE_PUBLIC_KEY --body '"$KEY"'`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
