name: Android

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: No-network guard (sources)
        run: |
          if grep -rnE 'java\.net|HttpURLConnection|okhttp|WebView|https?://' --include='*.kt' app/src/main; then
            echo "Networking APIs or web URLs found in Kotlin sources." && exit 1
          fi

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: No-network guard (built app)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "The app must not request INTERNET." && exit 1
          fi
