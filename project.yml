name: DutifulDailyDevotional
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  DutifulDailyDevotional:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: DutifulDailyDevotional
        excludes:
          - "Resources/Texts"
          - "Resources/Texts/**"
      # Folder reference so files keep their Texts/<source>/ paths inside the bundle.
      - path: DutifulDailyDevotional/Resources/Texts
        type: folder
    info:
      path: DutifulDailyDevotional/Info.plist
      properties:
        CFBundleDisplayName: Dutiful Daily Devotional
        CFBundleURLTypes:
          - CFBundleURLName: com.example.dutifuldailydevotional
            CFBundleURLSchemes: [dutifuldevotional]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: DutifulDailyDevotional/DutifulDailyDevotional.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.dutifuldailydevotional]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dutifuldailydevotional
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DutifulDailyDevotionalWidget

  DutifulDailyDevotionalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: DutifulDailyDevotionalWidget
    info:
      path: DutifulDailyDevotionalWidget/Info.plist
      properties:
        CFBundleDisplayName: Dutiful Devotional
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DutifulDailyDevotionalWidget/DutifulDailyDevotionalWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.dutifuldailydevotional]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dutifuldailydevotional.widget
        TARGETED_DEVICE_FAMILY: "1"

  DutifulDailyDevotionalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DutifulDailyDevotionalTests
        excludes:
          - "Fixtures"
          - "Fixtures/**"
      - path: DutifulDailyDevotionalTests/Fixtures/Texts
        type: folder
    dependencies:
      - target: DutifulDailyDevotional
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DutifulDailyDevotional.app/DutifulDailyDevotional"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DutifulDailyDevotional:
    build:
      targets:
        DutifulDailyDevotional: all
    test:
      targets:
        - DutifulDailyDevotionalTests
